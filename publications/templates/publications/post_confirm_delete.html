{% extends 'publications/base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-header">
                        <b>Удаление записи</b>
                    </div>
                    <div class="card-body">
                    <p class="card-text">Вы действительно хотите удалить запись: {{ post.name }}?</p>
                    <div class="card-body">
                        {% csrf_token %}
                        <a href="{% url 'publications:post_detail' post.pk %}" class="btn btn-primary">Отменить</a>
                        <button type="submit" class="btn btn-primary btn btn-danger">
                            Удалить
                        </button>
                    </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
