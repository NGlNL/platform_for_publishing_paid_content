<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Design Registration Form</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            box-sizing: border-box;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-field {
            position: relative;
            margin-bottom: 20px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: #6200ea;
            box-shadow: 0 0 5px rgba(98, 0, 234, 0.5);
        }

        .input-field label {
            position: absolute;
            left: 16px;
            top: 12px;
            font-size: 16px;
            color: #999;
            transition: all 0.3s ease;
        }

        .input-field input:focus + label,
        .input-field input:not(:placeholder-shown) + label {
            top: -8px;
            left: 16px;
            font-size: 12px;
            color: #6200ea;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #6200ea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #3700b3;
        }

        .text-center {
            text-align: center;
        }

        .text-center a {
            color: #6200ea;
            text-decoration: none;
        }

        .text-center a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Регистрация</h2>
        {% if form.errors %}
            {% for field, errors in form.errors.items %}
                <p style="color: red;">{{ field|capfirst }}: {% for error in errors %}{{ error }}{% if not forloop.last %}, {% endif %}{% endfor %}</p>
            {% endfor %}
        {% endif %}
        <form action="{% url 'users:register' %}" method="post">
            {% csrf_token %}
            <div class="input-field">
                <input type="text" id="phone" name="phone" required placeholder=" ">
                <label for="phone">Номер телефона</label>
            </div>
            <div class="input-field">
                <input type="email" id="email" name="email" required placeholder=" ">
                <label for="email">Email</label>
            </div>
            <div class="input-field">
                <input type="password" id="password1" name="password1" required placeholder=" ">
                <label for="password1">Пароль</label>
            </div>
            <div class="input-field">
                <input type="password" id="password2" name="password2" required placeholder=" ">
                <label for="password2">Подтвердите пароль</label>
            </div>
            <button type="submit" class="btn-submit">Зарегистрироватсья</button>
        </form>
        <div class="text-center">
            <p><a href="{% url 'users:login' %}">Назад</a></p>
        </div>
        <div class="text-center">
            <b><a href="{% url 'publications:home' %}">На главную</a></b>
        </div>
    </div>
</body>
</html>
